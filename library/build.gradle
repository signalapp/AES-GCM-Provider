apply plugin: 'com.android.library'
apply plugin: 'maven-publish'
apply plugin: 'signing'

archivesBaseName = "aesgcmprovider"
version          = "0.0.3"
group            = "org.signal"

android {
    namespace "org.signal.aesgcmprovider"
    compileSdkVersion 35
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        ndkVersion "28.0.13004108"
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=none"
                cFlags "-ffunction-sections -fdata-sections"
                targets "aesgcm"
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
    publishing {
        singleVariant("release")
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
    androidTestImplementation 'org.mockito:mockito-android:2.7.22'
}

def isReleaseBuild() {
    return version.contains("SNAPSHOT") == false
}

def getReleaseRepositoryUrl() {
    return hasProperty('sonatypeRepo') ? sonatypeRepo
            : "https://oss.sonatype.org/service/local/staging/deploy/maven2/"
}

def getRepositoryUsername() {
    return hasProperty('whisperSonatypeUsername') ? whisperSonatypeUsername : ""
}

def getRepositoryPassword() {
    return hasProperty('whisperSonatypePassword') ? whisperSonatypePassword : ""
}

signing {
    required { isReleaseBuild() && gradle.taskGraph.hasTask("publishing") }
    sign configurations.archives
}

afterEvaluate {
    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.release
                groupId = group
                artifactId = archivesBaseName

                pom {
                    name = 'aesgcmprovider'
                    packaging = 'aar'
                    description = 'A BoringSSL-backed AES-GCM provider for Android'
                    url = 'https://github.com/signalapp/AES-GCM-Provider'

                    scm {
                        url = 'scm:git@github.com:signalapp/AES-GCM-Provider.git'
                        connection = 'scm:git@github.com:signalapp/AES-GCM-Provider.git'
                        developerConnection = 'scm:git@github.com:signalapp/AES-GCM-Provider.git'
                    }

                    licenses {
                        license {
                            name = 'AGPLv3'
                            url = 'https://www.gnu.org/licenses/agpl-3.0.html'
                            distribution = 'repo'
                        }
                    }

                    developers {
                        developer {
                            name = 'Moxie Marlinspike'
                        }
                    }
                }
            }
        }

        repositories {
            maven {
                url = getReleaseRepositoryUrl()
                credentials {
                    username = getRepositoryUsername()
                    password = getRepositoryPassword()
                }
            }
        }
    }
}
